<script>
/*
  The booking calendar. availability.json holds booked nights only
  (see scripts/stay_availability.py). The visitor picks a room, the number of
  guests and the dates here; the button opens Airbnb with all three filled in.
  Korean is the source copy; add ja / en objects with the same keys to COPY.
*/
const COPY = {
  ko: {
    alleySay: '창밖으로 장독대와 기와지붕이 보이는 객실',
    gardenSay: '창밖으로 마당의 나무와 하늘이 보이는 객실',
    updated: '{when} 기준입니다. 최종 예약 가능 여부는 에어비앤비에서 확인됩니다.',
    sample: '지금 보이는 달력은 예시 데이터이며 실제 예약 현황이 아닙니다.',
    dayFree: '{date} 예약 가능',
    dayFull: '{date} 예약 마감',
    pickNone: '체크인할 날짜를 눌러 주세요.',
    pickSummary: '{room} · {guests} · {in} 체크인, {out} 체크아웃 · {n}박',
    pickOk: '지금 예약할 수 있는 날짜입니다.',
    pickHint: '더 묵으시려면 체크아웃할 날짜를 한 번 더 눌러 주세요.',
    pickBlocked: '그 사이에 예약이 마감된 날이 있어 그렇게는 선택할 수 없습니다.',
    pickFull: '예약이 마감된 날짜입니다.'
  },
  en: {}, ja: {}, zh: {"back": "返回客房介绍", "title": "可订日期", "lead": "选好客房、人数和日期后，点击“去 Airbnb 预订”，就会跳转到已选好条件的 Airbnb 预订页面。付款在 Airbnb 上完成。", "roomLabel": "客房", "alley": "小巷房", "garden": "庭院房", "guestLabel": "人数", "guest1": "1 人", "guest2": "2 人", "free": "可预订", "full": "已订出", "go": "去 Airbnb 预订", "fallbackSay": "暂时无法加载日历，请直接在 Airbnb 上查看日期。", "alleyAirbnb": "在 Airbnb 查看小巷房", "gardenAirbnb": "在 Airbnb 查看庭院房", "prev": "上个月", "next": "下个月", "alleySay": "窗外可见酱缸台和瓦屋顶的客房", "gardenSay": "窗外可见院中树木和天空的客房", "updated": "以上为 {when} 的数据，最终能否预订以 Airbnb 为准。", "sample": "当前显示的是示例数据，并非实际预订情况。", "dayFree": "{date} 可预订", "dayFull": "{date} 已订出", "pickNone": "请点选入住日期。", "pickSummary": "{room} · {guests} · {in} 入住，{out} 退房 · {n} 晚", "pickOk": "这些日期现在可以预订。", "pickHint": "如需多住几晚，请再点一下退房日期。", "pickBlocked": "所选日期中有已被预订的日子，无法这样选择。", "pickFull": "这一天已被预订。", "pageTitle": "可订日期 | Stay Eego", "metaDescription": "Stay Eego 各客房的可订日期。选好日期和人数后，即可前往 Airbnb 预订。"}, fr: {}
};
const PAGE = 'book';
// One address per language: scripts/stay_build_pages.py writes en/, ja/, zh/ and fr/ from this file,
// with the copy from i18n/<lang>.json already in the HTML, and sets PAGE_LANG and COPY there.
const PAGE_LANG = 'zh';
const LANGS = ['ko', 'en', 'ja', 'zh', 'fr'];
const HTML_LANG = { zh: 'zh-CN' };
const AIRBNB_HOST = { ko: 'www.airbnb.co.kr', en: 'www.airbnb.com', ja: 'www.airbnb.jp', zh: 'zh.airbnb.com', fr: 'www.airbnb.fr' };
const langSelect = document.getElementById('langSelect');
const ROOM_PATH = { garden: 'rooms/8525016', alley: 'rooms/1070715217838494598' };

const pick = attr => [...document.querySelectorAll('[' + attr + ']')];
const textNodes = pick('data-i18n'), ariaNodes = pick('data-i18n-aria');
textNodes.forEach(el => { COPY.ko[el.dataset.i18n] = el.innerHTML; });
COPY.ko.pageTitle = document.title;
COPY.ko.metaDescription = document.querySelector('meta[name="description"]').content;

const params = new URLSearchParams(location.search);
let lang = PAGE_LANG;
const t = (key, vars = {}) => (COPY[lang][key] ?? COPY.ko[key] ?? '').replace(/\{(\w+)\}/g, (_, k) => vars[k]);
// The built pages already carry their language in the HTML; this sets what the script draws.
function applyLang() {
  textNodes.forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  ariaNodes.forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.title = t('pageTitle');
  document.querySelector('meta[name="description"]').content = t('metaDescription');
  document.querySelectorAll('[data-airbnb]').forEach(a => { const u = new URL(a.href); u.host = AIRBNB_HOST[lang]; a.href = u.toString(); });
  langSelect.value = lang;
  render();
}
// The language menu goes to that language's own address, keeping the room, guests and section.
function langUrl(next) {
  const up = PAGE_LANG === 'ko' ? '' : '../';
  const dir = next === 'ko' ? up : up + next + '/';
  const keep = new URLSearchParams(location.search);
  keep.delete('lang'); keep.delete('v');
  const query = keep.toString();
  return (dir || './') + (PAGE === 'book' ? 'book.html' : '') + (query ? '?' + query : '') + location.hash;
}
langSelect.addEventListener('change', () => { location.href = langUrl(langSelect.value); });

const cal = document.getElementById('cal'), months = document.getElementById('months');
let avail = null, calOffset = 0;
let calRoom = params.get('room') === 'garden' ? 'garden' : 'alley';
let guests = params.get('guests') === '1' ? 1 : 2;
let pickIn = null, pickOut = null, pickPhase = 0, pickMsg = '';   // phase 1: check-in chosen, 2: check-out chosen too
const two = n => String(n).padStart(2, '0');
const todayInSeoul = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
const addDays = (day, n) => { const d = new Date(day + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const bookedSet = () => new Set(avail.rooms[calRoom].booked);
function nightsFree(from, to, booked) {
  for (let d = from; d < to; d = addDays(d, 1)) if (booked.has(d)) return false;
  return true;
}
function clearPick() { pickIn = pickOut = null; pickPhase = 0; pickMsg = ''; }
function choose(day) {
  const booked = bookedSet(), free = !booked.has(day);
  pickMsg = '';
  if (pickPhase === 1 && day > pickIn) {
    // second click: a check-out date. The check-out morning may fall on a booked night.
    if (nightsFree(pickIn, day, booked)) { pickOut = day; pickPhase = 2; }
    else if (free) { pickIn = day; pickOut = addDays(day, 1); pickPhase = 1; pickMsg = 'pickBlocked'; }
    else pickMsg = 'pickBlocked';
  } else if (free) {
    pickIn = day; pickOut = addDays(day, 1); pickPhase = 1;
  } else {
    pickMsg = 'pickFull';
  }
  render();
}
function render() {
  // room and guests
  document.querySelectorAll('#rooms button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.room === calRoom)));
  document.querySelectorAll('#guests button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.guests === guests)));
  document.getElementById('roomImg').src = `../img/${calRoom}/01-t.jpg`;
  document.getElementById('roomName').textContent = t(calRoom);
  document.getElementById('roomSay').textContent = t(calRoom + 'Say');
  if (!avail) return;

  const booked = bookedSet();
  const today = todayInSeoul(), [ty, tm] = today.split('-').map(Number);
  const shown = matchMedia('(min-width: 760px)').matches ? 2 : 1;
  const monthName = new Intl.DateTimeFormat(lang, { year: 'numeric', month: 'long', timeZone: 'UTC' });
  const dayName = new Intl.DateTimeFormat(lang, { month: 'long', day: 'numeric', timeZone: 'UTC' });
  const weekday = new Intl.DateTimeFormat(lang, { weekday: 'narrow', timeZone: 'UTC' });
  const nice = day => dayName.format(new Date(day + 'T00:00:00Z'));
  months.textContent = '';
  let lastShown = '';
  for (let k = 0; k < shown; k++) {
    const first = new Date(Date.UTC(ty, tm - 1 + calOffset + k, 1));
    const y = first.getUTCFullYear(), m = first.getUTCMonth();
    const count = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const box = document.createElement('div');
    box.className = 'month';
    const h = document.createElement('h2');
    h.textContent = monthName.format(first);
    const grid = document.createElement('div');
    grid.className = 'days';
    for (let w = 0; w < 7; w++) {                       // 2023-01-01 was a Sunday
      const el = document.createElement('span');
      el.className = 'wd';
      el.textContent = weekday.format(new Date(Date.UTC(2023, 0, 1 + w)));
      grid.append(el);
    }
    for (let b = 0; b < first.getUTCDay(); b++) grid.append(document.createElement('span'));
    for (let d = 1; d <= count; d++) {
      const day = `${y}-${two(m + 1)}-${two(d)}`;
      const off = day < today || day > avail.until;
      const full = booked.has(day);
      const el = document.createElement(off ? 'span' : 'button');
      let cls = 'day' + (off ? ' off' : full ? ' full' : ' free');
      if (pickIn && !off) {
        if (day === pickIn) cls += ' in';
        else if (day === pickOut) cls += ' out';
        else if (day > pickIn && day < pickOut) cls += ' mid';
      }
      el.className = cls;
      el.textContent = d;
      if (!off) {
        el.type = 'button';
        el.setAttribute('aria-label', t(full ? 'dayFull' : 'dayFree', { date: nice(day) }));
        if (day === pickIn) el.setAttribute('aria-pressed', 'true');
        el.addEventListener('click', () => choose(day));
      }
      grid.append(el);
    }
    box.append(h, grid);
    months.append(box);
    lastShown = `${y}-${two(m + 1)}`;
  }
  document.getElementById('calPrev').disabled = calOffset === 0;
  // Stop paging at the last month that still has an open night for this room.
  let lastOpen = today;
  for (const end = new Date(avail.until + 'T00:00:00Z'), d = new Date(today + 'T00:00:00Z'); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    const day = d.toISOString().slice(0, 10);
    if (!booked.has(day)) lastOpen = day;
  }
  document.getElementById('calNext').disabled = lastShown >= lastOpen.slice(0, 7);

  // what is picked, and the way to Airbnb with that room, those dates and that many guests
  const what = document.getElementById('pickWhat'), state = document.getElementById('pickState'), go = document.getElementById('goBook');
  if (pickIn) {
    const n = Math.round((new Date(pickOut) - new Date(pickIn)) / 86400000);
    what.textContent = t(n === 1 && (COPY[lang] || {}).pickSummary1 ? 'pickSummary1' : 'pickSummary', { room: t(calRoom), guests: t('guest' + guests), in: nice(pickIn), out: nice(pickOut), n });
    state.textContent = pickMsg ? t(pickMsg) : t('pickOk') + (pickPhase === 1 ? ' ' + t('pickHint') : '');
    go.href = `https://${AIRBNB_HOST[lang]}/${ROOM_PATH[calRoom]}?check_in=${pickIn}&check_out=${pickOut}&adults=${guests}`;
    go.setAttribute('aria-disabled', 'false');
  } else {
    what.textContent = t('pickNone');
    state.textContent = pickMsg ? t(pickMsg) : '';
    go.removeAttribute('href');
    go.setAttribute('aria-disabled', 'true');
  }
  const when = new Intl.DateTimeFormat(lang, { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Seoul' }).format(new Date(avail.updated));
  const note = document.getElementById('calNote');
  note.textContent = t('updated', { when });
  if (avail.sample) { const b = document.createElement('b'); b.textContent = ' ' + t('sample'); note.append(b); }
}
document.querySelectorAll('#rooms button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.room !== calRoom) { calRoom = b.dataset.room; calOffset = 0; clearPick(); }
  render();
}));
document.querySelectorAll('#guests button').forEach(b => b.addEventListener('click', () => { guests = +b.dataset.guests; render(); }));
document.getElementById('calPrev').addEventListener('click', () => { calOffset = Math.max(0, calOffset - 1); render(); });
document.getElementById('calNext').addEventListener('click', () => { calOffset += 1; render(); });
matchMedia('(min-width: 760px)').addEventListener('change', render);

fetch('../availability.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(data => {
    if (!(data && data.rooms && data.rooms.garden && data.rooms.alley)) return;
    avail = data;
    cal.hidden = false;
    document.getElementById('fallback').hidden = true;
    render();
  })
  .catch(() => {});
// Older links carried ?lang=ja; send them to that language's address.
if (PAGE_LANG === 'ko' && params.get('lang') !== 'ko' && LANGS.includes(params.get('lang'))) location.replace(langUrl(params.get('lang')));
else applyLang();
</script>
</body>
